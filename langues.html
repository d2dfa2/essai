<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anglais — Didou</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#182233;--muted:#657083;--accent:#4169e1;--good:#168a52;--bad:#c93636}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
.app{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:26px}
.card{background:var(--card);border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #0000000d}
button{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e9eefc;color:var(--ink)}
button.primary{background:var(--accent);color:white}button:hover{filter:brightness(.97)}
.back{display:inline-block;margin-bottom:10px;text-decoration:none;color:var(--accent);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0}
.tab{border-radius:16px;padding:16px;cursor:pointer;font-weight:800;font-size:16px;background:#e9eefc;text-align:center;transition:transform .1s}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:var(--accent);color:#fff}
.speak{background:#e9eefc;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}
.flip{background:var(--accent);color:#fff;border-radius:20px;padding:36px 20px;text-align:center;cursor:pointer;min-height:140px;display:flex;flex-direction:column;justify-content:center}
.flip .word{font-size:32px;font-weight:800}.flip .hint{font-size:14px;opacity:.8;margin-top:10px}
.badge{display:inline-block;font-size:14px;font-weight:800;padding:4px 12px;border-radius:999px;background:#fff;color:var(--accent);margin-top:12px}
input.answer{display:block;width:100%;max-width:480px;margin:15px auto;padding:14px;border:2px solid #ccd3df;border-radius:12px;font-size:22px;text-align:center}
.feedback{text-align:center;font-size:18px;font-weight:700;min-height:48px;margin:12px}
.progress{height:10px;background:#e1e5ec;border-radius:8px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.pill{background:#fff;border-radius:999px;padding:8px 12px;box-shadow:0 2px 8px #0001;font-weight:700}
.small{font-size:14px;color:var(--muted)}.sub{text-align:center;color:var(--muted)}
.hidden{display:none}
.mastered{font-size:13px;color:var(--good);font-weight:700}
.audiobar{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <a class="back" href="index.html">🏠 Accueil</a>
  <div class="top">
    <h1 id="title">📚 Anglais de Didou</h1>
    <div><span class="pill">⭐ <span id="score">0</span></span></div>
  </div>

  <section class="card">
    <div class="tabs">
      <div class="tab on" id="tab-words" onclick="goTab('words')">🇫🇷→🇬🇧 Vocabulaire</div>
      <div class="tab" id="tab-words-rev" onclick="goTab('words-rev')">🇬🇧→🇫🇷 Anglais vers français</div>
      <div class="tab" id="tab-phrases" onclick="goTab('phrases')">💬 Petites phrases</div>
    </div>
    <p class="small">Petites phrases : les deux sens (FR→EN et EN→FR) sont tirés au hasard. Raté → revient plus souvent. Validé 10 fois → maîtrisé 🏆.</p>
    <div class="audiobar">
      <button onclick="startReview()">🃏 Réviser les cartes</button>
      <button class="primary" onclick="startQuiz()">✏️ Quiz</button>
    </div>
  </section>

  <section class="card" id="view"></section>
</div>

<script src="data/vocab.js"></script>
<script>
const params=new URLSearchParams(location.search);
const langKey=params.get('lang')||'anglais';
const L=window.VOCAB_DATA[langKey]||Object.values(window.VOCAB_DATA)[0];
const BRAVOS=['✅ Bravo Didou !','✅ Super, bien joué !','✅ Excellent, tu progresses !','✅ Parfait, continue comme ça !'];
const COURAGE=['💡 Pas grave, on apprend de ses erreurs !','💡 Presque ! Regarde bien la réponse, tu vas la retenir.','💡 Ce n\u2019est pas encore ça, mais chaque essai compte. Courage !'];
const NATURE={nom:'nom',verbe:'verbe',adjectif:'adjectif',formule:'formule',phrase:'phrase'};
const MASTER_AT=10;
const WORDS_LESSONS=L.lessons.filter(l=>(l.pairs||[]).length&&(l.pairs[0][2]||'')!=='phrase');
const PHRASE_LESSONS=L.lessons.filter(l=>(l.pairs||[]).length&&l.pairs[0][2]==='phrase');
let tab='words', mode=null, cardIdx=0, flipped=false, deck=[];
let qIdx=0, qTotal=10, score=Number(localStorage['score_'+langKey]||0), current=null, answered=false;
let stats=JSON.parse(localStorage['vstats_'+langKey]||'{}');
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
$('title').textContent=`${L.flag} ${L.label} de Didou`;

function pairs(){return (tab==='phrases'?PHRASE_LESSONS:WORDS_LESSONS).flatMap(l=>l.pairs||[])}
/* Sens de la question courante : current.toEn = true → traduire EN ;
   false → traduire FR. Chaque question garde son sens du début à la fin. */
function dirLabel(){return current&&current.toEn?'en '+L.label.toLowerCase():'en français'}

/* Synthèse vocale : uniquement sur clic d'un bouton 🔊 */
function speak(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang=L.speech;speechSynthesis.speak(u)}catch(e){}}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;'\u2019]/g,'').replace(/\s+/g,' ').trim()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nat(p){return p[2]?`<span class="badge">${esc(NATURE[p[2]]||p[2])}</span>`:''}
function keyOf(p){return p[0]+'::'+p[1]}
function st(k){return stats[k]||{c:0,w:0}}
function record(k,ok){
  if(!stats[k])stats[k]={c:0,w:0};
  if(ok)stats[k].c++;else stats[k].w++;
  localStorage['vstats_'+langKey]=JSON.stringify(stats);
}

/* ---------- onglets ---------- */
function goTab(t){tab=t;qIdx=0;current=null;mode=null;deck=[];
  ['words','words-rev','phrases'].forEach(x=>$('tab-'+x).classList.toggle('on',x===t));
  render();
}
function startReview(){mode='review';deck=[];render()}
function startQuiz(){mode='quiz';qIdx=0;current=draw();answered=false;render()}

function render(){
  let v=$('view');
  if(!mode){
    const p=pairs();
    v.innerHTML=`<div class="sub">${p.length} cartes dans cet onglet · clique sur 🃏 Réviser ou ✏️ Quiz pour commencer !</div>`;
    return;
  }
  if(mode==='review'){
    if(!deck.length){deck=[...pairs()].sort(()=>Math.random()-.5);cardIdx=0;flipped=false}
    const p=deck[cardIdx];const s=st(keyOf(p));
    v.innerHTML=`<div class="sub">${cardIdx+1}/${deck.length} · clique sur la carte pour retourner</div>
      <div class="flip" onclick="flipped=!flipped;render()">
        <div class="word" style="font-size:${p[0].length>32?24:32}px">${flipped?esc(p[1]):esc(p[0])}</div>
        <div class="hint">${flipped?esc(p[0]):'Traduis dans ta tête, puis clique'}</div>
        ${flipped?nat(p):''}
      </div>
      <div class="audiobar">
        <button onclick="cardIdx=(cardIdx-1+deck.length)%deck.length;flipped=false;render()">←</button>
        <button class="speak" onclick="speak(${JSON.stringify(p[1]).replace(/"/g,'&quot;')})">🔊 Écouter</button>
        <button class="primary" onclick="cardIdx=(cardIdx+1)%deck.length;flipped=false;render()">→</button>
      </div>
      ${s.c>=MASTER_AT?'<p class="sub mastered">🏆 Cette carte est maîtrisée !</p>':''}`;
  } else if(mode==='quiz'){
    if(!current){
      v.innerHTML='<h3>🏆 Incroyable !</h3><p>Toutes les questions de cet onglet sont maîtrisées. Tu es trop forte, Didou ! 💖</p>';
      return;
    }
    const toEn=current.toEn;
    const shown=toEn?current.p[0]:current.p[1];
    v.innerHTML=`<div class="progress"><div class="bar" style="width:${qIdx/qTotal*100}%"></div></div>
      <div class="sub">Question ${qIdx+1}/${qTotal} · traduis ${dirLabel()}</div>
      <div class="flip" style="cursor:default"><div class="word" style="font-size:${shown.length>32?24:32}px">${esc(shown)}</div>${nat(current.p)}
        <button class="speak" onclick="speak(${JSON.stringify(shown).replace(/"/g,'&quot;')})">🔊 Écouter</button></div>
      <input class="answer" id="ans" autocomplete="off" placeholder="Ta réponse">
      <button class="primary" style="display:block;margin:auto" onclick="check()">Valider</button>
      <div class="feedback" id="fb"></div>
      <button id="next" class="primary hidden" onclick="nextQ()">Continuer →</button>`;
    $('ans').focus();$('ans').onkeydown=e=>{if(e.key==='Enter')check()};
  }
}

/* ---------- tirage : insiste sur les échecs ---------- */
function draw(){
  const all=pairs();if(!all.length)return null;
  let pool=[];
  all.forEach(p=>{
    const s=st(keyOf(p));
    if(s.c>=MASTER_AT)return;
    for(let i=0;i<1+s.w;i++)pool.push(p);
  });
  if(!pool.length)return null;
  const p=pool[Math.floor(Math.random()*pool.length)];
  /* sens : Vocabulaire → EN ; Anglais vers français → FR ; Petites phrases → aléatoire */
  const toEn=tab==='words'?true:tab==='words-rev'?false:Math.random()<.5;
  return {p,toEn};
}
function check(){
  if(answered)return;
  const expected=current.toEn?current.p[1]:current.p[0];
  const ok=norm($('ans').value)===norm(expected);
  answered=true;
  record(keyOf(current.p),ok);
  if(ok)score+=10;
  localStorage['score_'+langKey]=score;
  $('score').textContent=score;
  $('fb').style.color=ok?'var(--good)':'var(--bad)';
  const mastered=ok&&st(keyOf(current.p)).c>=MASTER_AT;
  $('fb').innerHTML=ok?pick(BRAVOS)+(mastered?' 🏆 Cette question est maintenant maîtrisée !':'')
    :`${pick(COURAGE)} La bonne réponse était : <b>${esc(expected)}</b>`;
  $('next').classList.remove('hidden');
}
function nextQ(){
  qIdx++;answered=false;current=draw();
  if(qIdx>=qTotal){
    $('view').innerHTML=`<h3>🏁 Quiz terminé !</h3>
      <p>Tu as gagné ${score} ⭐, Didou. Les questions ratées reviendront gentiment pour t\u2019entraîner encore. Tu progresses, bravo ! 💖</p>
      <button class="primary" onclick="startQuiz()">Rejouer</button>`;
    return;
  }
  render();
}
$('score').textContent=score;
goTab('words');
</script>
</body></html>
