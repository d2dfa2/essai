<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulaire — Didou</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#182233;--muted:#657083;--accent:#4169e1;--good:#168a52;--bad:#c93636}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
.app{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:26px}
.card{background:var(--card);border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #0000000d}
button{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e9eefc;color:var(--ink)}
button.primary{background:var(--accent);color:white}button:hover{filter:brightness(.97)}
button.rec{background:#fde3e3;color:#c93636}
.back{display:inline-block;margin-bottom:10px;text-decoration:none;color:var(--accent);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{border-radius:999px;padding:8px 14px;background:#e9eefc;cursor:pointer;font-weight:700;font-size:14px}
.chip.on{background:var(--accent);color:#fff}
.modebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0}
.vocab-table{width:100%;border-collapse:collapse;margin-top:10px}
.vocab-table td{padding:10px 8px;border-bottom:1px solid #e7ebf2}
.vocab-table td.lang{font-weight:800}.vocab-table td.fr{color:var(--muted)}
.speak,.mic{background:#e9eefc;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}
.flip{background:var(--accent);color:#fff;border-radius:20px;padding:36px 20px;text-align:center;cursor:pointer;min-height:140px;display:flex;flex-direction:column;justify-content:center}
.flip .word{font-size:32px;font-weight:800}.flip .hint{font-size:14px;opacity:.8;margin-top:10px}
input.answer{display:block;width:100%;max-width:360px;margin:15px auto;padding:14px;border:2px solid #ccd3df;border-radius:12px;font-size:22px;text-align:center}
.choice{display:block;width:100%;max-width:480px;margin:10px auto;text-align:left;background:#f0f3f9;font-size:18px}
.choice.correct{background:#dff5e9}.choice.wrong{background:#fde3e3}
.feedback{text-align:center;font-size:18px;font-weight:700;min-height:48px;margin:12px}
.progress{height:10px;background:#e1e5ec;border-radius:8px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.pill{background:#fff;border-radius:999px;padding:8px 12px;box-shadow:0 2px 8px #0001;font-weight:700}
.small{font-size:14px;color:var(--muted)}.sub{text-align:center;color:var(--muted)}
.hidden{display:none}
.mastered{font-size:13px;color:var(--good);font-weight:700}
.audiobar{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <a class="back" href="index.html">🏠 Accueil</a>
  <div class="top">
    <h1 id="title">📚 Vocabulaire</h1>
    <div><span class="pill">⭐ <span id="score">0</span></span></div>
  </div>

  <section class="card">
    <h3>1. Choisis ta leçon <span class="small">(préparation d'un contrôle)</span></h3>
    <div class="chips" id="lessons"></div>
    <h3>2. Choisis ton mode</h3>
    <div class="modebar">
      <button onclick="setMode('list')">📖 Réviser</button>
      <button onclick="setMode('flash')">🃏 Cartes</button>
      <button class="primary" onclick="setMode('quiz')">✏️ Quiz de leçon</button>
    </div>
    <div class="modebar">
      <button class="primary" onclick="setMode('pool')">🎲 Quiz général — toutes les leçons</button>
    </div>
    <p class="small">Dans le quiz général, les questions ratées reviennent plus souvent, et celles validées 10 fois ne sont plus posées : elles sont maîtrisées ! 🏆</p>
  </section>

  <section class="card" id="view"></section>
</div>

<script src="data/vocab.js"></script>
<script>
const params=new URLSearchParams(location.search);
const langKey=params.get('lang')||'anglais';
const L=window.VOCAB_DATA[langKey]||Object.values(window.VOCAB_DATA)[0];
const BRAVOS=['✅ Bravo Didou !','✅ Super, bien joué !','✅ Excellent, tu progresses !','✅ Parfait, continue comme ça !'];
const COURAGE=['💡 Pas grave, on apprend de ses erreurs !','💡 Presque ! Regarde bien la réponse, tu vas la retenir.','💡 Ce n\u2019est pas encore ça, mais chaque essai compte. Courage !'];
const MASTER_AT=10;
let lesson=L.lessons[0], mode='list', cardIdx=0, flipped=false, deck=[];
let qIdx=0, qTotal=10, score=Number(localStorage['score_'+langKey]||0), current=null, answered=false;
let stats=JSON.parse(localStorage['vstats_'+langKey]||'{}');
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
$('title').textContent=`${L.flag} ${L.label} de Didou`;

function speak(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang=L.speech;speechSynthesis.speak(u)}catch(e){}}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;'\u2019]/g,'').replace(/\s+/g,' ').trim()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* questions d'une leçon : paires + QCM */
function lessonPairs(l){return (l.pairs||[])}
function lessonMcq(l){return (l.mcq||[])}
function pairKey(p){return p[0]+'::'+p[1]}
function mcqKey(l,m){return l.id+'::mcq::'+m.q}
function st(k){return stats[k]||{c:0,w:0}}
function record(k,ok){
  if(!stats[k])stats[k]={c:0,w:0};
  if(ok)stats[k].c++;else stats[k].w++;
  localStorage['vstats_'+langKey]=JSON.stringify(stats);
}
function allLessons(){return mode==='pool'?L.lessons:[lesson]}
function masterCount(){return L.lessons.reduce((n,l)=>n+lessonPairs(l).filter(p=>st(pairKey(p)).c>=MASTER_AT).length+lessonMcq(l).filter(m=>st(mcqKey(l,m)).c>=MASTER_AT).length,0)}
function totalQ(){return L.lessons.reduce((n,l)=>n+lessonPairs(l).length+lessonMcq(l).length,0)}

/* ---------- Enregistrement voix ---------- */
let mediaRec=null, audioChunks=[];
async function toggleRec(btn){
  try{
    if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks=[];
    mediaRec=new MediaRecorder(stream);
    let url=null;
    mediaRec.ondataavailable=e=>audioChunks.push(e.data);
    mediaRec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      url=URL.createObjectURL(new Blob(audioChunks,{type:'audio/webm'}));
      btn.textContent='🎤 Dire encore';btn.classList.remove('rec');
      const pb=document.createElement('button');pb.className='speak';pb.textContent='▶️ Ma voix';
      pb.onclick=()=>new Audio(url).play();
      btn.after(pb);
    };
    mediaRec.start();
    btn.textContent='⏹️ Arrêter';btn.classList.add('rec');
  }catch(e){btn.textContent='🎤 Micro refusé';setTimeout(()=>btn.textContent='🎤 Ma voix',1500)}
}

/* ---------- Leçons / modes ---------- */
function buildLessonChips(){
  $('lessons').innerHTML='';
  L.lessons.forEach(l=>{
    let c=document.createElement('span');c.className='chip'+(l.id===lesson.id&&mode!=='pool'?' on':'');c.textContent=l.title;
    c.onclick=()=>{lesson=l;setMode(mode==='pool'?'list':mode)};$('lessons').appendChild(c);
  });
}
function setMode(m){mode=m;deck=[];buildLessonChips();render()}

function render(){
  let v=$('view');
  if(mode==='list'){
    if(!lessonPairs(lesson).length){
      v.innerHTML=`<h3>${lesson.title}</h3><p class="small">Cette leçon se travaille en quiz (grammaire ou culture) : lance le ✏️ Quiz de leçon !</p>`;
      return;
    }
    v.innerHTML=`<h3>${lesson.title}</h3><table class="vocab-table">${lessonPairs(lesson).map(p=>{
      const s=st(pairKey(p));
      return `<tr><td class="fr">${esc(p[0])}</td><td class="lang">${esc(p[1])}</td>
      <td><button class="speak" onclick="speak(${JSON.stringify(p[1]).replace(/"/g,'&quot;')})">🔊 Modèle</button></td>
      <td><button class="mic" onclick="toggleRec(this)">🎤 Ma voix</button></td>
      <td>${s.c>=MASTER_AT?'<span class="mastered">🏆 maîtrisé</span>':''}</td></tr>`}).join('')}</table>
      <p class="small">Astuce : écoute le modèle, dis le mot, puis réécoute-toi. Se comparer au modèle, c\u2019est le meilleur moyen de progresser !</p>`;
  } else if(mode==='flash'){
    if(!deck.length){deck=[...lessonPairs(lesson)].sort(()=>Math.random()-.5);cardIdx=0;flipped=false}
    if(!deck.length){v.innerHTML='<div class="sub">Pas de cartes dans cette leçon : essaie le ✏️ Quiz !</div>';return}
    const p=deck[cardIdx];const s=st(pairKey(p));
    v.innerHTML=`<div class="sub">${cardIdx+1}/${deck.length} · clique sur la carte pour retourner</div>
      <div class="flip" onclick="flipped=!flipped;render()">
        <div class="word">${flipped?esc(p[1]):esc(p[0])}</div>
        <div class="hint">${flipped?esc(p[0]):'Traduis dans ta tête, puis clique'}</div>
      </div>
      <div class="audiobar">
        <button onclick="cardIdx=(cardIdx-1+deck.length)%deck.length;flipped=false;render()">←</button>
        <button class="speak" onclick="speak(${JSON.stringify(p[1]).replace(/"/g,'&quot;')})">🔊 Modèle</button>
        <button class="mic" onclick="toggleRec(this)">🎤 Ma voix</button>
        <button class="primary" onclick="cardIdx=(cardIdx+1)%deck.length;flipped=false;render()">→</button>
      </div>
      ${s.c>=MASTER_AT?'<p class="sub mastered">🏆 Ce mot est maîtrisé !</p>':''}`;
  } else if(mode==='quiz'||mode==='pool'){
    if(!current){current=draw();answered=false}
    if(!current){
      v.innerHTML=mode==='pool'
        ? '<h3>🏆 Incroyable !</h3><p>Toutes les questions du pool général sont maîtrisées. Tu es trop forte, Didou ! 💖</p>'
        : '<div class="sub">Cette leçon est encore vide : ajoute du contenu ou choisis une autre leçon.</div>';
      return;
    }
    v.innerHTML=`<div class="progress"><div class="bar" style="width:${qIdx/qTotal*100}%"></div></div>
      <div class="sub">${mode==='pool'?'Quiz général · ':''}Question ${qIdx+1}/${qTotal}${current.kind==='pair'?` · traduis ${current.toLang?'en '+L.label.toLowerCase():'en français'}`:''}</div>
      <div class="flip" style="cursor:default"><div class="word">${esc(current.kind==='pair'?(current.toLang?current.p[0]:current.p[1]):current.m.q)}</div>
        ${current.kind==='pair'?`<button class="speak" onclick="speak(${JSON.stringify(current.toLang?current.p[0]:current.p[1]).replace(/"/g,'&quot;')})">🔊 Écouter</button>`:''}</div>
      ${current.kind==='pair'
        ?`<input class="answer" id="ans" autocomplete="off" placeholder="Ta réponse">
          <button class="primary" style="display:block;margin:auto" onclick="check()">Valider</button>`
        :current.m.a.map((x,i)=>`<button class="choice" onclick="checkM(${i===current.m.correct},this)">${esc(x)}</button>`).join('')}
      <div class="feedback" id="fb"></div>
      <button id="next" class="primary hidden" onclick="nextQ()">Continuer →</button>`;
    if(current.kind==='pair'){$('ans').focus();$('ans').onkeydown=e=>{if(e.key==='Enter')check()}}
  }
}

/* ---------- Tirage ---------- */
function draw(){
  const lessons=allLessons();
  let pool=[];
  lessons.forEach(l=>{
    lessonPairs(l).forEach(p=>{
      const s=st(pairKey(p));const lim=mode==='pool'?0:2;
      if(mode!=='pool'||s.c<MASTER_AT){for(let i=0;i<1+Math.min(s.w,lim+1);i++)pool.push({kind:'pair',p,toLang:Math.random()<.5,key:pairKey(p)})}
    });
    lessonMcq(l).forEach(m=>{
      const s=st(mcqKey(l,m));
      if(mode!=='pool'||s.c<MASTER_AT){for(let i=0;i<1+Math.min(s.w,3);i++)pool.push({kind:'mcq',m,key:mcqKey(l,m)})}
    });
  });
  if(!pool.length)return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function feedback(ok,expected){
  answered=true;
  record(current.key,ok);
  if(ok)score+=10;
  localStorage['score_'+langKey]=score;
  $('score').textContent=score;
  $('fb').style.color=ok?'var(--good)':'var(--bad)';
  const mastered=ok&&st(current.key).c>=MASTER_AT;
  $('fb').innerHTML=ok?pick(BRAVOS)+(mastered?' 🏆 Cette question est maintenant maîtrisée !':'')
    :`${pick(COURAGE)} ${expected?`La bonne réponse était : <b>${esc(expected)}</b>`:''}<br><span class="small">${esc(current.m?current.m.explain:'')}</span>`;
  $('next').classList.remove('hidden');
}
function check(){
  if(answered)return;
  const expected=current.toLang?current.p[1]:current.p[0];
  const ok=norm($('ans').value)===norm(expected);
  feedback(ok,expected);
}
function checkM(ok,btn){
  if(answered)return;
  btn.classList.add(ok?'correct':'wrong');
  feedback(ok,current.m.a[current.m.correct]);
}
function nextQ(){
  qIdx++;current=null;
  if(qIdx>=qTotal){
    const mc=masterCount(),tot=totalQ();
    $('view').innerHTML=`<h3>🏁 Quiz terminé !</h3>
      <p>Tu as gagné ${score} ⭐, Didou. ${mode==='pool'?`Questions maîtrisées : ${mc}/${tot}. `:''}Les questions ratées reviendront gentiment pour t\u2019entraîner encore. Tu progresses, bravo ! 💖</p>
      <button class="primary" onclick="qIdx=0;setMode('${mode}')">Rejouer</button>`;
    return;
  }
  render();
}
$('score').textContent=score;
buildLessonChips();setMode('list');
</script>
</body></html>
